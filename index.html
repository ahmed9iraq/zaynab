<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيانة الموقع | أحمد</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#05070d;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,rgba(0,170,255,.12),transparent 70%);
    top:-180px;
    right:-150px;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,rgba(100,50,255,.10),transparent 70%);
    bottom:-200px;
    left:-150px;
}

.container{
    width:90%;
    max-width:650px;
    text-align:center;
    position:relative;
    z-index:2;
    padding:45px 30px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(18px);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.icon{
    width:90px;
    height:90px;
    margin:0 auto 30px;
    border-radius:50%;
    border:2px solid rgba(0,190,255,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.icon::before{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    border:1px solid rgba(0,190,255,.12);
    border-radius:50%;
    animation:pulse 2s infinite;
}

.icon span{
    font-size:40px;
    animation:gear 4s linear infinite;
}

h1{
    font-size:30px;
    margin-bottom:15px;
    letter-spacing:.5px;
}

.subtitle{
    color:#aeb7c6;
    font-size:16px;
    line-height:2;
    margin-bottom:30px;
}

.highlight{
    color:#00bfff;
    font-weight:bold;
}

.progress{
    width:100%;
    height:6px;
    background:rgba(255,255,255,.07);
    border-radius:20px;
    overflow:hidden;
    margin:25px 0 12px;
}

.progress span{
    display:block;
    width:70%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#0077ff,#00d9ff);
    animation:loading 2.5s ease-in-out infinite;
}

.status{
    color:#7f8b9c;
    font-size:13px;
}

.divider{
    width:60px;
    height:1px;
    background:rgba(255,255,255,.15);
    margin:30px auto;
}

.maintainer{
    color:#8e99aa;
    font-size:14px;
}

.maintainer strong{
    color:#fff;
}

.footer{
    margin-top:25px;
    color:#566172;
    font-size:11px;
    letter-spacing:1px;
}

.dots span{
    animation:dots 1.5s infinite;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

@keyframes gear{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(.9);
        opacity:.3;
    }
    50%{
        transform:scale(1.1);
        opacity:.8;
    }
}

@keyframes loading{
    0%{
        transform:translateX(110%);
    }
    50%{
        transform:translateX(0);
    }
    100%{
        transform:translateX(-110%);
    }
}

@keyframes dots{
    0%,60%,100%{
        opacity:.2;
    }
    30%{
        opacity:1;
    }
}

@media(max-width:500px){
    .container{
        padding:40px 22px;
    }

    h1{
        font-size:24px;
    }

    .subtitle{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">
        <span>⚙</span>
    </div>

    <h1>الموقع قيد الصيانة</h1>

    <div class="subtitle">
        حالياً الموقع تحت الصيانه Z🌝
        <br>
        بس يمكن لو ادزلكي الموقع لو لا حسب يا Z
    </div>

    <div class="progress">
        <span></span>
    </div>

    <div class="status">
        جارٍ تنفيذ التحديثات
        <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </span>
    </div>

    <div class="divider"></div>

    <div class="maintainer">
        تتم صيانة وتطوير الموقع بواسطة
        <strong>أحمد</strong>
    </div>

    <div class="footer">
        SYSTEM MAINTENANCE • AHMED DEVELOPMENT
    </div>

</div>

</body>
</html>
