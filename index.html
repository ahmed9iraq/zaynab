<p>
بمادة اسمها تصميم مواقع
</p>

<div class="quote">
🌝
</div>

<button type="button" class="main-btn" onclick="nextPage(1)">
نرجع للبداية 🌸
</button>
</div>


<div class="progress">
<div class="dot active" id="dot1"></div>
<div class="dot" id="dot2"></div>
<div class="dot" id="dot3"></div>
<div class="dot" id="dot4"></div>
</div>

</div>


<script>
let currentPage = 1;

function nextPage(page){

const current = document.getElementById("page" + currentPage);
const next = document.getElementById("page" + page);

if(!current || !next){
return;
}

current.classList.add("hidden");
next.classList.remove("hidden");

currentPage = page;

updateDots();
}


function updateDots(){

for(let i = 1; i <= 4; i++){

const dot = document.getElementById("dot" + i);

if(dot){
dot.classList.toggle("active", i === currentPage);
}

}

}


function answer(choice){

const result = document.getElementById("result");

if(!result){
return;
}

result.style.display = "block";


if(choice === "yes"){

result.innerHTML = `
<div class="result">
<div class="emoji">🌸</div>
<h2>هااا خوش 😂❤️</h2>
<p>تمام ياسچاچة😂 🌷</p>
<button type="button" class="main-btn" onclick="nextPage(4)">نكمل 🌸</button>
</div>
`;

}else{

result.innerHTML = `
<div class="result">
<div class="emoji">🌷</div>
<h2>تمام يابه</h2>
<p>براحتكي سچاچة😂🌝</p>
<button type="button" class="main-btn" onclick="nextPage(4)">نكمل 🌸</button>
</div>
`;

}

}
</script>

</body>
</html>
